name: probe (temporary)

# TEMPORARY diagnostic workflow - deleted before merge. Answers one question:
# which QMediaPlayer teardown order survives Qt 6.10.3 on a headless runner?

on: workflow_dispatch

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-no-audio-server
          - os: macos-15
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt runtime libs (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          pick() { apt-cache show "$1" >/dev/null 2>&1 && echo "$1" || echo "$2"; }
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            "$(pick libpulse0t64 libpulse0)" \
            "$(pick libasound2t64 libasound2)" \
            "$(pick libglib2.0-0t64 libglib2.0-0)"

      - name: Install PySide6
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6==6.10.3"

      - name: Probe teardown variants
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/probe_qt_destroy.py

      - name: Probe again with a PulseAudio null sink (linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y pulseaudio
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1 --disallow-exit || true
          pactl load-module module-null-sink sink_name=ci || true
          pactl set-default-sink ci || true
          pactl info || true
          python tools/probe_qt_destroy.py
