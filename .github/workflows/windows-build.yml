name: windows-build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only the release step needs this
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nuitka

      - name: Build with Nuitka (standalone, PySide6 plugin)
        run: >
          python -m nuitka --standalone --assume-yes-for-downloads
          --enable-plugin=pyside6
          --windows-console-mode=disable
          --windows-icon-from-ico=icon.ico
          --output-dir=build
          --output-filename=HiCloudMP.exe
          --include-data-file=web_panel.html=web_panel.html
          --include-data-file=icon.ico=icon.ico
          main.py

      - name: Bundle ffmpeg for cover extraction
        run: |
          curl -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          powershell -Command "Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpegbuild -Force"
          $ff = Get-ChildItem -Path ffmpegbuild -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ff.FullName build\main.dist\ffmpeg.exe

      - name: Package portable zip
        run: |
          Compress-Archive -Path build\main.dist\* -DestinationPath HiCloudMP-portable.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HiCloudMP-portable
          path: HiCloudMP-portable.zip

      - name: Build installer (Inno Setup)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          choco install innosetup -y --no-progress
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$ver packaging\HiCloudMP.iss

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HiCloudMP-portable.zip
            packaging/Output/HiCloudMP-Setup-*.exe
          generate_release_notes: true
