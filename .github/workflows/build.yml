name: windows-build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ruff (syntax errors + pyflakes only)
        run: |
          python -m pip install ruff
          python -m ruff check .

  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only the release step needs this
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin the packaged multimedia stack: PySide6 6.10.3 (FFmpeg 7.1.3)
          # is the runtime the app is tuned and verified against. 6.12.x
          # (FFmpeg 9) measured slower local decode opens (~0.7 s vs ~0.3 s
          # first audible) and shipped the buggier playback this app gets
          # blamed for; ">=6.10.1" otherwise floats to the newest minor.
          python -m pip install "PySide6==6.10.3"
          python -m pip install -r requirements.txt
          # Pin the compiler too: reproducible builds need the same Nuitka
          # major series (4.3.x handled the PySide6 6.10 packaging fine).
          python -m pip install "nuitka==4.3.1"

      - name: Build with Nuitka (standalone, PySide6 plugin)
        run: >
          python -m nuitka --standalone --assume-yes-for-downloads
          --enable-plugin=pyside6
          --windows-console-mode=disable
          --windows-icon-from-ico=icon.ico
          --output-dir=build
          --output-filename=HiCloudMP.exe
          --include-data-file=web_panel.html=web_panel.html
          --include-data-file=icon.ico=icon.ico
          main.py

      - name: Bundle Qt multimedia backend (ffmpegmediaplugin)
        run: |
          # Nuitka's PySide6 plugin ships qt6multimedia.dll/QtMultimedia.pyd but
          # NOT the qt-plugins\multimedia backend - and since Qt 6.8 the ffmpeg
          # plugin is the ONLY audio decoder. Without it the packaged app plays
          # nothing (the engine AND the native fallback both need it).
          $ps = python -c "import PySide6, os; print(os.path.dirname(PySide6.__file__))"
          $dst = "build\main.dist\PySide6\qt-plugins\multimedia"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$ps\plugins\multimedia\*.dll" $dst -ErrorAction Stop
          Copy-Item "$ps\avcodec-*.dll","$ps\avformat-*.dll","$ps\avutil-*.dll","$ps\swresample-*.dll","$ps\swscale-*.dll" build\main.dist -ErrorAction Stop

      - name: Bundle ffmpeg for cover extraction
        run: |
          # Version-pinned (a "release-essentials" alias silently changes
          # behavior when Gyan publishes a new build). 9.0.2 essentials:
          # sha256 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba
          curl -L -o ffmpeg.zip https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip
          powershell -Command "Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpegbuild -Force"
          $ff = Get-ChildItem -Path ffmpegbuild -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ff.FullName build\main.dist\ffmpeg.exe

      - name: Package portable zip
        run: |
          Compress-Archive -Path build\main.dist\* -DestinationPath HiCloudMP-portable.zip -Force

      - name: Build installer (Inno Setup)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          choco install innosetup -y --no-progress
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$ver packaging\HiCloudMP.iss
          # Stable-named alias so README/site can link
          # releases/latest/download/HiCloudMP-Setup.exe forever (the
          # versioned file remains the canonical download page asset).
          Copy-Item "packaging\Output\HiCloudMP-Setup-$ver.exe" packaging\Output\HiCloudMP-Setup.exe

      - name: Upload build artifact (portable + installers for the release job)
        uses: actions/upload-artifact@v4
        with:
          name: HiCloudMP-windows
          path: |
            HiCloudMP-portable.zip
            packaging/Output/HiCloudMP-Setup-*.exe
            packaging/Output/HiCloudMP-Setup.exe

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build prerequisites (MPRIS build deps + ccache)
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache python3-dev libglib2.0-dev libdbus-1-dev libdbus-glib-1-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Same toolchain pins as the Windows job: one Qt, one Nuitka series
          # across every platform, so behavior and reproducibility match.
          python -m pip install "PySide6==6.10.3"
          python -m pip install "nuitka==4.3.1"
          python -m pip install -r requirements.txt
          # MPRIS (system media keys): PyGObject/dbus-python build from
          # source against the apt packages installed above.
          python -m pip install -r requirements-linux.txt
          # Bundled ffmpeg for cover extraction comes from a pinned PyPI
          # package (imageio-ffmpeg ships static per-arch binaries; versioned
          # by PyPI, so no floating download aliases).
          python -m pip install "imageio-ffmpeg==0.6.0"

      - name: Test suite (offscreen Qt) before Nuitka
        run: python -m pytest -x -q

      - name: Build with Nuitka (standalone, PySide6 plugin)
        run: >
          python -m nuitka --standalone --assume-yes-for-downloads
          --enable-plugin=pyside6
          --output-dir=build
          --output-filename=HiCloudMP
          --include-data-file=web_panel.html=web_panel.html
          --include-data-file=icon.png=icon.png
          main.py

      - name: Bundle Qt multimedia backend (ffmpegmediaplugin)
        run: |
          set -e
          # Same v1.0.0-class guard as the Windows job: Nuitka ships the
          # qt6multimedia libs but NOT the multimedia ffmpeg backend (the
          # only audio decoder since Qt 6.8).
          ps=$(python -c "import PySide6, os; print(os.path.dirname(PySide6.__file__))")
          src=""
          for cand in "$ps/plugins/multimedia" "$ps/Qt/plugins/multimedia"; do
            if [ -d "$cand" ]; then src="$cand"; break; fi
          done
          if [ -z "$src" ]; then echo "multimedia plugin dir not found under $ps"; ls "$ps"; exit 1; fi
          mkdir -p build/main.dist/PySide6/qt-plugins/multimedia
          cp "$src"/*.so build/main.dist/PySide6/qt-plugins/multimedia/
          # The backend's ffmpeg libs must ride along (wheels keep them in
          # the PySide6 package dir; try the root first, then Qt/).
          for lib in libavcodec libavformat libavutil libswresample libswscale; do
            cp "$ps/$lib"*.so* build/main.dist/ 2>/dev/null || cp "$ps/Qt/$lib"*.so* build/main.dist/
          done

      - name: Bundle ffmpeg for cover extraction
        run: |
          set -e
          ff=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          cp "$ff" build/main.dist/ffmpeg
          # cover_extractor.find_ffmpeg() looks beside the compiled binary
          # first, then PATH - a bundled sibling hits the fast path.
          chmod +x build/main.dist/ffmpeg

      - name: Assemble AppDir
        run: |
          set -e
          mkdir -p AppDir/usr/bin
          cp -r build/main.dist/* AppDir/usr/bin/
          if [ -f AppDir/usr/bin/main.bin ] && [ ! -f AppDir/usr/bin/HiCloudMP ]; then
            mv -f AppDir/usr/bin/main.bin AppDir/usr/bin/HiCloudMP
          fi
          cp packaging/linux/HiCloudMP.desktop AppDir/HiCloudMP.desktop
          cp build/main.dist/icon.png AppDir/HiCloudMP.png
          ln -sf HiCloudMP.png AppDir/.DirIcon
          # AppRun is an exec wrapper so the standalone dist keeps resolving
          # its libs relative to usr/bin (a copied binary would not).
          echo '#!/bin/sh' > AppDir/AppRun
          echo 'exec "$(dirname "$0")/usr/bin/HiCloudMP" "$@"' >> AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/HiCloudMP

      - name: Package AppImage (appimagetool 1.9.1, version-pinned)
        run: |
          set -e
          # Pinned versioned release (asset updated 2025-12-04); continuous
          # would track a moving target, same rule as the Windows ffmpeg pin.
          # sha256 ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          curl -L -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage
          ver="${GITHUB_REF_NAME#v}"
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir "HiCloudMP-$ver-linux-x86_64.AppImage"

      - name: Package portable tarball
        run: |
          set -e
          tar -czf "HiCloudMP-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz" -C build main.dist

      - name: Stable alias for releases/latest links
        run: |
          set -e
          cp "HiCloudMP-${GITHUB_REF_NAME#v}-linux-x86_64.AppImage" HiCloudMP-linux-x86_64.AppImage

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HiCloudMP-linux
          path: |
            HiCloudMP-*-linux-x86_64.AppImage
            HiCloudMP-linux-x86_64.AppImage
            HiCloudMP-*-linux-x86_64.tar.gz

  build-macos:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Same toolchain pins as the Windows/Linux jobs: one Qt, one
          # Nuitka series on every platform.
          python -m pip install "PySide6==6.10.3"
          python -m pip install "nuitka==4.3.1"
          python -m pip install -r requirements.txt
          # Apple Silicon only build (free-hosted runners are arm64);
          # README documents this. imageio-ffmpeg supplies a pinned static
          # ffmpeg for cover extraction without any floating alias URL.
          python -m pip install "imageio-ffmpeg==0.6.0"

      - name: Test suite (offscreen Qt) before Nuitka
        run: python -m pytest -x -q

      - name: Generate .icns from icon.png
        run: packaging/macos/make-icns.sh

      - name: Build with Nuitka (standalone, PySide6, .app bundle)
        run: >
          python -m nuitka --standalone --assume-yes-for-downloads
          --enable-plugin=pyside6
          --macos-create-app-bundle
          --macos-app-name="HiCloudMP"
          --macos-app-icon=build/icon.icns
          --output-dir=build
          --output-filename=HiCloudMP
          --include-data-file=web_panel.html=web_panel.html
          --include-data-file=icon.png=icon.png
          main.py

      - name: Show bundle layout (layout-drift visibility for CI triage)
        run: find build/main.dist/HiCloudMP.app -maxdepth 3 | head -n 40

      - name: Bundle Qt multimedia backend (ffmpegmediaplugin)
        run: |
          set -e
          # Same v1.0.0-class guard as Windows/Linux: without the multimedia
          # ffmpeg backend the packaged app plays nothing (only audio decoder
          # since Qt 6.8). Nuitka's bundler keeps the qt-plugins tree under
          # PySide6 inside Contents/MacOS; the av/sw dylibs sit beside the
          # executable.
          ps=$(python -c "import PySide6, os; print(os.path.dirname(PySide6.__file__))")
          src=""
          for cand in "$ps/plugins/multimedia" "$ps/Qt/plugins/multimedia"; do
            if [ -d "$cand" ]; then src="$cand"; break; fi
          done
          if [ -z "$src" ]; then echo "multimedia plugin dir not found under $ps"; ls "$ps"; exit 1; fi
          app="build/main.dist/HiCloudMP.app/Contents/MacOS"
          mkdir -p "$app/PySide6/qt-plugins/multimedia"
          if ls "$src"/*.dylib >/dev/null 2>&1; then
            cp "$src"/*.dylib "$app/PySide6/qt-plugins/multimedia/"
          else
            cp "$src"/*.so "$app/PySide6/qt-plugins/multimedia/"
          fi
          for lib in libavcodec libavformat libavutil libswresample libswscale; do
            cp "$ps/$lib"*.dylib "$app/" 2>/dev/null || cp "$ps/Qt/$lib"*.dylib "$app/"
          done

      - name: Bundle ffmpeg for cover extraction
        run: |
          set -e
          app="build/main.dist/HiCloudMP.app/Contents/MacOS"
          ff=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          cp "$ff" "$app/ffmpeg"
          chmod +x "$app/ffmpeg"

      - name: Ad-hoc code signature (required to launch unsigned apps on arm64)
        run: codesign --force --deep --sign - build/main.dist/HiCloudMP.app

      - name: Package DMG
        run: |
          set -e
          hdiutil create -volname HiCloudMP -srcfolder build/main.dist/HiCloudMP.app \
            -ov -format UDZO "HiCloudMP-${GITHUB_REF_NAME#v}-macos-arm64.dmg"

      - name: Stable alias for releases/latest links
        run: |
          set -e
          cp "HiCloudMP-${GITHUB_REF_NAME#v}-macos-arm64.dmg" HiCloudMP-macOS.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HiCloudMP-macos
          path: |
            HiCloudMP-*-macos-arm64.dmg
            HiCloudMP-macOS.dmg

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    # All-or-nothing: nothing publishes unless every platform built.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # release needs to push files
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      - name: Publish release (prerelease on rc tags)
        uses: softprops/action-gh-release@v2
        with:
          # ?*-globs cover only the versioned files; the stable alias files
          # are listed explicitly. Every link lives on releases/latest/download/.
          files: |
            release-assets/HiCloudMP-portable.zip
            release-assets/packaging/Output/HiCloudMP-Setup-*.exe
            release-assets/packaging/Output/HiCloudMP-Setup.exe
            release-assets/HiCloudMP-?*-linux-x86_64.AppImage
            release-assets/HiCloudMP-linux-x86_64.AppImage
            release-assets/HiCloudMP-?*-linux-x86_64.tar.gz
            release-assets/HiCloudMP-?*-macos-arm64.dmg
            release-assets/HiCloudMP-macOS.dmg
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}
